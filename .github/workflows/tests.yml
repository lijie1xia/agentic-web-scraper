name: tests

# 只跑离线用例：不注入任何密钥，不访问招聘平台，不调用 LLM。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    name: 离线测试（244 项，含真实 Chromium 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装测试依赖
        # 工作流与评分用例只用标准库；只有浏览器冒烟需要 Playwright。
        # 不安装 requirements.txt，避免 camel-ai/crawl4ai 的 psutil 冲突拖慢 CI。
        run: |
          python -m pip install -U pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: 岗位工作流用例
        run: python -m unittest discover -s tests -p "test_job_*.py" -v
      - name: 评分与生成用例
        run: |
          python tests/test_decision.py
          python tests/test_generate.py
